name: SHJR Manual Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release version (example: v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean
      custom_message:
        description: "Optional release message"
        required: false
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag_name }}
  RELEASE_MESSAGE: ${{ inputs.custom_message }}

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Create tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag "${TAG_NAME}" || echo "Tag exists"
          git push origin "${TAG_NAME}" || echo "Already pushed"

  build:
    name: Build SHJR
    needs: create-tag
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      tag_name: ${{ inputs.tag_name }}
      prerelease: ${{ inputs.prerelease }}
      custom_message: ${{ inputs.custom_message }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linuxBuild
          path: release/linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild
          path: release/windows

      - name: Zip Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          cd release/linux
          zip -r ../../SHJR-linux.zip .

      - name: Zip Windows build
        run: |
          cd release/windows
          zip -r ../../SHJR-windows.zip .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_MESSAGE }}
          files: |
            SHJR-linux.zip
            SHJR-windows.zip
          prerelease: ${{ inputs.prerelease }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
